name: Deploy DASH DASH RUN

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    defaults:
      run:
        working-directory: "project-bolt-sb1-364jgj8n (2)"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Build game
        run: npm run build

      - name: Upload game
        uses: actions/upload-pages-artifact@v3
        with:
          path: "project-bolt-sb1-364jgj8n (2)/dist"

      - name: Publish game
        id: deployment
        uses: actions/deploy-pages@v4
